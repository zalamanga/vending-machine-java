services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vending_demo
      MYSQL_USER: vending_demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD dalam .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${DB_PORT:-18806}:3306"
    volumes:
      - vending_data:/var/lib/mysql
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
volumes:
  vending_data:
